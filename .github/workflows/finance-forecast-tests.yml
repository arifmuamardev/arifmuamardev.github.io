name: Finance dashboard quality regression tests

on:
  push:
    paths:
      - "finance/**"
      - ".github/workflows/finance-forecast-tests.yml"
  pull_request:
    paths:
      - "finance/**"
      - ".github/workflows/finance-forecast-tests.yml"

permissions:
  contents: read

jobs:
  forecast-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run finance read-only quality regression tests
        run: node --test finance/tests/*.test.cjs
